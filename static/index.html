<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模組 3｜對話式策略諮詢顧問</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #3fb950; box-shadow: 0 0 6px #3fb950;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #e6edf3; }
    header .mode-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    header .mode-badge span { color: #58a6ff; font-weight: 600; }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      overflow: hidden;
    }

    /* ── Quick buttons ── */
    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 0 10px;
      flex-shrink: 0;
    }
    .quick-btns button {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid #388bfd;
      background: transparent;
      color: #58a6ff;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .quick-btns button:hover { background: #1f3a5f; }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .msg-row.user  { flex-direction: row-reverse; }
    .msg-row.assistant { flex-direction: row; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-row.user .avatar     { background: #1f6feb; }
    .msg-row.assistant .avatar { background: #21262d; border: 1px solid #30363d; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #1f6feb;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: #161b22;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
      color: #e6edf3;
    }

    /* SOP 欄位高亮 */
    .bubble .tag-clause  { color: #f78166; font-weight: 600; }
    .bubble .tag-basis   { color: #ffa657; }
    .bubble .tag-action  { color: #3fb950; }
    .bubble .tag-cascade { color: #58a6ff; }

    /* 分析中 indicator */
    .thinking {
      display: flex; align-items: center; gap: 8px;
      color: #8b949e; font-size: 13px; padding: 4px 0;
    }
    .thinking .dots span {
      display: inline-block;
      width: 5px; height: 5px; border-radius: 50%;
      background: #8b949e; margin: 0 1px;
      animation: bounce .9s infinite;
    }
    .thinking .dots span:nth-child(2) { animation-delay: .15s; }
    .thinking .dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-5px); }
    }

    /* 錯誤訊息 */
    .bubble.error { background: #2d1a1a; border-color: #f85149; color: #f85149; }

    /* ── Input area ── */
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 0 16px;
      flex-shrink: 0;
      border-top: 1px solid #21262d;
    }
    #questionInput {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      height: 44px;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color .15s;
      font-family: inherit;
    }
    #questionInput:focus { border-color: #388bfd; }
    #questionInput::placeholder { color: #484f58; }
    #sendBtn {
      background: #238636;
      border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 600;
      padding: 0 18px; cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    #sendBtn:hover:not(:disabled) { background: #2ea043; }
    #sendBtn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    /* ── Welcome placeholder ── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #484f58;
      gap: 8px;
      text-align: center;
    }
    #welcome .icon { font-size: 40px; }
    #welcome p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>🚦 交通指揮中心｜策略諮詢顧問</h1>
  <div class="mode-badge">LLM 模式：<span id="modeLabel">讀取中…</span></div>
</header>

<main>
  <!-- 快捷提問 -->
  <div class="quick-btns" role="group" aria-label="快捷提問">
    <button onclick="quickAsk('若 BS_MRT_BL17 人數增至 40,000 人？')">🚇 BL17 增至 40,000 人</button>
    <button onclick="quickAsk('忠孝東路飽和度到 0.96 算哪一級？')">🚗 飽和度 0.96</button>
    <button onclick="quickAsk('忠孝東路飽和度到 0.90 算哪一級？')">🚗 飽和度 0.90</button>
    <button onclick="quickAsk('大巨蛋 Growth_Rate 降至 -0.25？')">🏟️ 散場 -0.25</button>
    <button onclick="quickAsk('台北101廣場漫遊率 35% 要處置嗎？')">🌐 漫遊率 35%</button>
    <button onclick="quickAsk('飽和度 0.80 要處置嗎？')">🟢 飽和度 0.80</button>
    <button onclick="quickAsk('那如果再加 5,000 人？')">➕ 再加 5,000 人</button>
  </div>

  <!-- 訊息區 -->
  <div id="messages" role="log" aria-live="polite" aria-label="對話記錄">
    <div id="welcome">
      <div class="icon">🛡️</div>
      <p>輸入假設性問題或點選上方快捷按鈕<br>AI 將即時檢索 SOP 並給出應變建議</p>
    </div>
  </div>

  <!-- 輸入區 -->
  <div class="input-area">
    <textarea
      id="questionInput"
      placeholder="輸入 What-if 問題，例如：若 BL17 人數增至 40,000 人？"
      rows="1"
      aria-label="輸入問題"
    ></textarea>
    <button id="sendBtn" aria-label="送出問題">送出</button>
  </div>
</main>

<script>
  // ── 狀態 ──
  const history = [];   // [{ role, content }]
  let isLoading = false;

  // ── DOM refs ──
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('questionInput');
  const sendBtn      = document.getElementById('sendBtn');
  const welcomeEl    = document.getElementById('welcome');
  const modeLabelEl  = document.getElementById('modeLabel');

  // ── 初始化：讀取 LLM 模式 ──
  fetch('/health')
    .then(r => r.json())
    .then(d => { modeLabelEl.textContent = d.mode ?? '未知'; })
    .catch(() => { modeLabelEl.textContent = '離線'; });

  // ── 快捷提問 ──
  function quickAsk(text) {
    if (isLoading) return;
    inputEl.value = text;
    sendMessage();
  }

  // ── 送出訊息 ──
  async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question || isLoading) return;

    // 隱藏 welcome
    if (welcomeEl) welcomeEl.style.display = 'none';

    // 顯示使用者訊息
    appendBubble('user', question);
    history.push({ role: 'user', content: question });
    inputEl.value = '';
    adjustTextareaHeight();

    // 顯示「分析中」
    const thinkingId = appendThinking();
    setLoading(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: history.slice(0, -1) }),
      });

      const data = await res.json();
      removeThinking(thinkingId);

      if (data.ok) {
        appendBubble('assistant', data.answer);
        history.push({ role: 'assistant', content: data.answer });
        // 更新 mode label
        if (data.mode) modeLabelEl.textContent = data.mode;
      } else {
        appendBubble('assistant', data.error || 'AI 服務發生錯誤', true);
        history.pop(); // 移除失敗的 user 訊息
      }
    } catch (err) {
      removeThinking(thinkingId);
      appendBubble('assistant', `無法連線到後端伺服器：${err.message}`, true);
      history.pop();
    } finally {
      setLoading(false);
    }
  }

  // ── 新增氣泡 ──
  function appendBubble(role, text, isError = false) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';
    avatar.setAttribute('aria-hidden', 'true');

    const bubble = document.createElement('div');
    bubble.className = `bubble${isError ? ' error' : ''}`;
    bubble.innerHTML = role === 'assistant' ? formatAnswer(text) : escapeHtml(text);

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  // ── 格式化 AI 回答：高亮四個欄位 ──
  function formatAnswer(text) {
    return escapeHtml(text)
      .replace(/(■ 觸發條款：[^\n]+)/g,  '<span class="tag-clause">$1</span>')
      .replace(/(■ 判定依據：[^\n]+)/g,  '<span class="tag-basis">$1</span>')
      .replace(/(■ 預期動作：[^\n]+)/g,  '<span class="tag-action">$1</span>')
      .replace(/(■ 連鎖檢查：[^\n]+)/g,  '<span class="tag-cascade">$1</span>')
      .replace(/(■ 備註：[^\n]+)/g,       '<span style="color:#8b949e">$1</span>');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── 分析中動畫 ──
  function appendThinking() {
    const id = `thinking-${Date.now()}`;
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = id;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    avatar.setAttribute('aria-hidden', 'true');

    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = `
      <span>分析中，檢索 SOP…</span>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>`;

    row.appendChild(avatar);
    row.appendChild(thinking);
    messagesEl.appendChild(row);
    scrollToBottom();
    return id;
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── 工具函式 ──
  function setLoading(val) {
    isLoading = val;
    sendBtn.disabled = val;
    inputEl.disabled = val;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function adjustTextareaHeight() {
    inputEl.style.height = '44px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  // ── 鍵盤：Enter 送出，Shift+Enter 換行 ──
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', adjustTextareaHeight);

  sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
