<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>squirrel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; }
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #10161d;
      --panel-2: #151c24;
      --line: #26313d;
      --muted: #8c98a7;
      --text: #edf2f7;
      --soft: #c7d0dc;
      --blue: #7db7ad;
      --blue-2: #2f7f75;
      --green: #7ccf91;
      --amber: #d6a45d;
    }
    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 82% 16%, rgba(124, 207, 145, .08), transparent 28%),
        radial-gradient(circle at 16% 88%, rgba(214, 164, 93, .07), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 56px 0 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(124, 207, 145, .16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 207, 145, .16) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(110deg, transparent 0%, black 28%, black 62%, transparent 100%);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 15, 20, .92);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    header h1 {
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
      letter-spacing: 0;
    }
    header .mode-badge {
      margin-left: auto;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    header .mode-badge span { color: var(--soft); font-weight: 650; }
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .quick-panel {
      padding: 14px 0 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .quick-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
    }
    .quick-direct,
    .quick-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .quick-direct button,
    .quick-categories button,
    #quickAskBtn {
      min-height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--soft);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .quick-direct button {
      color: #c6e9cf;
      border-color: rgba(124, 207, 145, .38);
    }
    .quick-direct button:hover { background: rgba(124, 207, 145, .08); }
    .quick-categories button:hover,
    .quick-categories button.active {
      color: var(--text);
      border-color: rgba(110, 168, 255, .8);
      background: rgba(110, 168, 255, .10);
    }
    .quick-builder {
      display: grid;
      grid-template-columns: minmax(260px, 560px) auto;
      gap: 10px;
      align-items: center;
    }
    #quickSelect {
      width: 100%;
      height: 40px;
      min-width: 0;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    #quickSelect:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(110, 168, 255, .12);
    }
    #quickAskBtn {
      height: 40px;
      color: var(--blue);
      border-color: rgba(110, 168, 255, .65);
    }
    #quickAskBtn:hover { background: rgba(110, 168, 255, .10); }
    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 0 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #2a3541; border-radius: 999px; }
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel);
      font-size: 11px;
      font-weight: 700;
    }
    .msg-row.user .avatar { display: none; }
    .bubble {
      max-width: min(760px, 86%);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      letter-spacing: 0;
    }
    .msg-row.user .bubble {
      max-width: min(720px, 82%);
      background: #296f69;
      color: #fff;
      border: 1px solid rgba(255,255,255,.08);
    }
    .msg-row.assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .bubble .answer-lead {
      display: block;
      color: var(--text);
      font-weight: 650;
    }
    .bubble .tag-action {
      display: block;
      margin-top: 8px;
      color: #8ee6a5;
      font-weight: 650;
    }
    .bubble .tag-cascade {
      display: block;
      margin-top: 6px;
      color: #8ed8ca;
      font-weight: 650;
    }
    .thinking {
      width: min(320px, 78vw);
      padding: 8px 0 2px;
      color: var(--muted);
      font-size: 13px;
    }
    .runway {
      position: relative;
      height: 40px;
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(124, 207, 145, .28);
      overflow: hidden;
      --run-distance: 250px;
    }
    .runway::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(214, 164, 93, .45) 14px 18px);
      animation: signalLine 1.1s linear infinite;
    }
    .e-squirrel {
      position: absolute;
      left: 6px;
      bottom: 0;
      width: 52px;
      height: 34px;
      animation: squirrelRun 1.8s ease-in-out infinite;
      overflow: visible;
    }
    .e-squirrel .tail,
    .e-squirrel .body,
    .e-squirrel .head {
      fill: var(--green);
      filter: drop-shadow(0 0 5px rgba(124, 207, 145, .24));
    }
    .e-squirrel .chip,
    .e-squirrel .leg {
      stroke: var(--amber);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .e-squirrel .eye {
      fill: #0b0f14;
    }
    .thinking-text {
      display: block;
      color: var(--muted);
    }
    @keyframes squirrelRun {
      0% { transform: translateX(0) translateY(0); }
      45% { transform: translateX(var(--run-distance)) translateY(-2px); }
      50% { transform: translateX(var(--run-distance)) translateY(-2px) scaleX(-1); }
      95% { transform: translateX(0) translateY(0) scaleX(-1); }
      100% { transform: translateX(0) translateY(0); }
    }
    @keyframes signalLine {
      from { background-position-x: 0; }
      to { background-position-x: -36px; }
    }
    .bubble.error { background: #271818; border-color: #f85149; color: #ffb4ae; }
    .input-area {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      padding: 10px 0 20px;
      flex-shrink: 0;
    }
    .input-shortcuts {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 0;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .input-shortcuts .quick-label {
      margin: 0;
      min-width: max-content;
    }
    .input-shortcuts .quick-direct {
      margin: 0;
      flex: 1;
    }
    #questionInput {
      width: 100%;
      height: 48px;
      max-height: 132px;
      padding: 12px 14px;
      resize: none;
      overflow-y: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 1.55;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #questionInput:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(110, 168, 255, .12);
    }
    #questionInput::placeholder { color: #667282; }
    #sendBtn,
    #resetBtn {
      height: 48px;
      padding: 0 18px;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, border-color .15s, color .15s;
    }
    #sendBtn {
      border: 1px solid var(--blue-2);
      background: var(--blue-2);
      color: #fff;
    }
    #sendBtn:hover:not(:disabled) { background: #2b7df0; }
    #sendBtn:disabled,
    #resetBtn:disabled { opacity: .45; cursor: not-allowed; }
    #resetBtn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }
    #resetBtn:hover:not(:disabled) {
      color: var(--text);
      border-color: #3b4856;
      background: rgba(255,255,255,.03);
    }
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 6px;
      text-align: center;
    }
    #welcome .icon { display: none; }
    #welcome p { font-size: 14px; line-height: 1.7; }
    @media (max-width: 760px) {
      header { padding: 0 16px; }
      main { padding: 0 16px; }
      .quick-builder,
      .input-area { grid-template-columns: 1fr; }
      .input-shortcuts { align-items: flex-start; }
      .runway { --run-distance: calc(100vw - 130px); }
      #sendBtn,
      #resetBtn { width: 100%; }
      .bubble,
      .msg-row.user .bubble { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>交通指揮策略諮詢顧問 Squirrel</h1>
  <div class="mode-badge">LLM 模式：<span id="modeLabel">讀取中…</span></div>
</header>

<main>
  <!-- SOP 分類快捷提問 -->
  <div class="quick-panel" aria-label="SOP 分類快捷提問">
    <div class="quick-label">選擇情境與地點</div>
    <div class="quick-categories" role="group" aria-label="SOP 類別">
      <button type="button" data-quick-set="incident">車禍與路障應變</button>
      <button type="button" data-quick-set="signal">號誌故障應變</button>
      <button type="button" data-quick-set="notification">數位通報</button>
    </div>
    <div class="quick-builder">
      <select id="quickSelect" aria-label="選擇地點"></select>
      <button type="button" id="quickAskBtn">套用情境</button>
    </div>
  </div>

  <!-- 訊息區 -->
  <div id="messages" role="log" aria-live="polite" aria-label="對話記錄">
    <div id="welcome">
      <div class="icon"></div>
      <p>輸入假設性問題，或使用快捷情境</p>
    </div>
  </div>

  <div class="input-shortcuts" aria-label="固定範圍快捷提問">
    <div class="quick-label">常用假設</div>
    <div class="quick-direct" role="group" aria-label="固定情境快捷提問">
      <button type="button" onclick="quickAsk('交通壅塞級別如何判定？')">壅塞級別判定</button>
      <button type="button" onclick="quickAsk('假設忠孝東路四段已達 A 級壅塞，依 SOP 要啟動哪些交通應變？')">忠孝東路四段 A 級</button>
      <button type="button" onclick="quickAsk('假設光復南路已達 B 級壅塞，依 SOP 要啟動哪些交通應變？')">光復南路 B 級</button>
      <button type="button" onclick="quickAsk('假設捷運國父紀念館站人潮增至 40,000 人，依 SOP 要啟動哪些捷運與接駁措施？')">國父紀念館站分流</button>
      <button type="button" onclick="quickAsk('假設大巨蛋人潮曾達 40,000 人且開始散場，依 SOP 要啟動哪些措施並連動什麼檢查？')">大巨蛋散場啟動</button>
    </div>
  </div>

  <!-- 輸入區 -->
  <div class="input-area">
    <textarea
      id="questionInput"
      placeholder="直接輸入假設性問題，例如：如果光復南路發生事故，應該怎麼處理？"
      rows="1"
      aria-label="輸入問題"
    ></textarea>
    <button id="resetBtn" aria-label="清除對話">清除</button>
    <button id="sendBtn" aria-label="送出問題">送出</button>
  </div>
</main>

<script>
  // ── 狀態 ──
  const history = [];   // [{ role, content }]
  let isLoading = false;
  const urlParams = new URLSearchParams(window.location.search);
  const currentSnapshotTimestamp = urlParams.get('snapshot_timestamp') || urlParams.get('ts') || null;

  // ── DOM refs ──
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('questionInput');
  const sendBtn      = document.getElementById('sendBtn');
  const resetBtn     = document.getElementById('resetBtn');
  const welcomeEl    = document.getElementById('welcome');
  const modeLabelEl  = document.getElementById('modeLabel');
  const quickSelectEl = document.getElementById('quickSelect');
  const quickAskBtn   = document.getElementById('quickAskBtn');
  let activeQuickSet = 'incident';

  // ── 初始化：讀取 LLM 模式 ──
  fetch('/health')
    .then(r => r.json())
    .then(d => { modeLabelEl.textContent = d.mode ?? '未知'; })
    .catch(() => { modeLabelEl.textContent = '離線'; });

  // ── SOP 分類快捷提問 ──
  const roadNames = [
    '忠孝東路四段',
    '光復南路',
    '基隆路一段',
    '市民大道四段',
    '仁愛路四段',
    '敦化南路一段',
    '松高路',
    '延吉街',
    '基隆路地下道',
    '市府路',
    '松壽路',
    '敦化南路二段',
    '信義路五段',
    '松智路',
    '復興南路一段',
  ];

  const stationNames = [
    '大巨蛋場館內',
    '捷運國父紀念館站',
    '松山文創園區',
    '捷運忠孝敦化站',
    '信義威秀商圈',
    '台北101廣場',
    '市府轉運站',
    'ATT4FUN周邊',
    '捷運市政府站',
  ];

  const quickSets = {
    incident: roadNames.map(name => ({
      label: name,
      text: `如果${name}發生嚴重車禍並造成路段封鎖，依 SOP 應該怎麼改道、通報，預計多久恢復？`,
    })),
    signal: roadNames.map(name => ({
      label: name,
      text: `如果${name}號誌故障，依 SOP 要怎麼派遣現場人力、發布 CMS，預計多久恢復？`,
    })),
    notification: stationNames.map(name => ({
      label: name,
      text: `檢查${name}是否需要啟動多語通報。`,
    })),
  };

  function showQuickSet(key) {
    const options = quickSets[key] || [];
    activeQuickSet = key;
    quickSelectEl.innerHTML = '';
    options.forEach(item => {
      const option = document.createElement('option');
      option.value = item.text;
      option.textContent = item.label;
      quickSelectEl.appendChild(option);
    });

    document.querySelectorAll('[data-quick-set]').forEach(button => {
      button.classList.toggle('active', button.dataset.quickSet === key);
    });
  }

  document.querySelectorAll('[data-quick-set]').forEach(button => {
    button.addEventListener('click', () => showQuickSet(button.dataset.quickSet));
  });
  quickAskBtn.addEventListener('click', () => {
    if (!quickSelectEl.value) return;
    quickAsk(quickSelectEl.value);
  });
  showQuickSet('incident');

  function quickAsk(text) {
    if (isLoading) return;
    inputEl.value = text;
    inputEl.focus();
    sendMessage();
  }

  // ── 送出訊息 ──
  async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question || isLoading) return;

    // 隱藏 welcome
    if (welcomeEl) welcomeEl.style.display = 'none';

    // 顯示使用者訊息
    appendBubble('user', question);
    history.push({ role: 'user', content: question });
    inputEl.value = '';
    adjustTextareaHeight();

    // 顯示「分析中」
    const thinkingId = appendThinking();
    const thinkingStartedAt = performance.now();
    setLoading(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question,
          history: history.slice(0, -1),
          snapshot_timestamp: currentSnapshotTimestamp,
        }),
      });

      const data = await res.json();
      await finishThinking(thinkingId, thinkingStartedAt);

      if (data.ok) {
        appendBubble('assistant', data.answer);
        history.push({ role: 'assistant', content: data.answer });
        // 更新 mode label
        if (data.mode) modeLabelEl.textContent = data.mode;
      } else {
        appendBubble('assistant', data.error || 'AI 服務發生錯誤', true);
        history.pop(); // 移除失敗的 user 訊息
      }
    } catch (err) {
      await finishThinking(thinkingId, thinkingStartedAt);
      appendBubble('assistant', `無法連線到後端伺服器：${err.message}`, true);
      history.pop();
    } finally {
      setLoading(false);
    }
  }

  // ── 新增氣泡 ──
  function appendBubble(role, text, isError = false) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '你' : 'SQ';
    avatar.setAttribute('aria-hidden', 'true');

    const bubble = document.createElement('div');
    bubble.className = `bubble${isError ? ' error' : ''}`;
    bubble.innerHTML = role === 'assistant' ? formatAnswer(text) : escapeHtml(text);

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  // ── 格式化 AI 回答：第一行是結論，後續是處置與確認 ──
  function formatAnswer(text) {
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    if (!lines.length) return '';

    return lines.map((line, index) => {
      if (index === 0 && line.trim()) return `<span class="answer-lead">${line}</span>`;
      if (/^■ 建議處置：/.test(line)) return `<span class="tag-action">${line}</span>`;
      if (/^■ 後續確認：/.test(line)) return `<span class="tag-cascade">${line}</span>`;
      return line;
    }).join('\n');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── 分析中動畫 ──
  function appendThinking() {
    const id = `thinking-${Date.now()}`;
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = id;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'SQ';
    avatar.setAttribute('aria-hidden', 'true');

    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = `
      <div class="runway" aria-hidden="true">
        <svg class="e-squirrel" viewBox="0 0 64 42" role="img" aria-label="Squirrel loading">
          <path class="tail" d="M45 25c12-3 11-21-1-21-7 0-11 5-9 11 2-3 5-5 9-4 6 1 6 9 1 11-4 2-8 1-11-1v8c3 1 7 0 11-4z"/>
          <ellipse class="body" cx="29" cy="27" rx="15" ry="9"/>
          <circle class="head" cx="14" cy="22" r="8"/>
          <path class="body" d="M10 15l4-7 4 7z"/>
          <circle class="eye" cx="12" cy="20" r="1.7"/>
          <path class="leg" d="M25 34l-5 5M35 34l5 5"/>
          <path class="chip" d="M23 25h10M28 20v10M38 26h5M18 28h-5"/>
        </svg>
      </div>
      <span class="thinking-text">Squirrel 正在檢索 SOP…</span>`;

    row.appendChild(avatar);
    row.appendChild(thinking);
    messagesEl.appendChild(row);
    scrollToBottom();
    return id;
  }

  async function finishThinking(id, startedAt) {
    const minimumMs = 800;
    const elapsed = performance.now() - startedAt;
    if (elapsed < minimumMs) {
      await new Promise(resolve => setTimeout(resolve, minimumMs - elapsed));
    }
    removeThinking(id);
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── 工具函式 ──
  function setLoading(val) {
    isLoading = val;
    sendBtn.disabled = val;
    resetBtn.disabled = val;
    inputEl.disabled = false;
    if (!val) inputEl.focus();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function adjustTextareaHeight() {
    inputEl.style.height = '52px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  // ── 鍵盤：Enter 送出，Shift+Enter 換行 ──
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', adjustTextareaHeight);

  sendBtn.addEventListener('click', sendMessage);
  resetBtn.addEventListener('click', () => {
    if (isLoading) return;
    history.length = 0;
    messagesEl.querySelectorAll('.msg-row').forEach(row => row.remove());
    if (welcomeEl) welcomeEl.style.display = 'flex';
    inputEl.value = '';
    adjustTextareaHeight();
  });
</script>
</body>
</html>
