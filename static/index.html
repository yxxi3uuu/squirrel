<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>squirrel</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    header .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #3fb950; box-shadow: 0 0 6px #3fb950;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #e6edf3; }
    header .mode-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    header .mode-badge span { color: #58a6ff; font-weight: 600; }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      overflow: hidden;
    }

    /* ── Quick buttons ── */
    .quick-panel {
      padding: 12px 0 10px;
      flex-shrink: 0;
      border-bottom: 1px solid #21262d;
    }
    .quick-label {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 7px;
    }
    .quick-direct,
    .quick-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-direct,
    .quick-categories { margin-bottom: 10px; }
    .quick-direct button,
    .quick-categories button,
    #quickAskBtn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .quick-direct button {
      border: 1px solid #238636;
      color: #3fb950;
    }
    .quick-direct button:hover { background: #173a24; }
    .quick-categories button {
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    .quick-categories button:hover,
    .quick-categories button.active {
      background: #1f3a5f;
      border-color: #388bfd;
      color: #58a6ff;
    }
    .quick-builder {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 8px;
      max-width: 520px;
    }
    #quickSelect {
      min-width: 0;
      width: 100%;
      height: 34px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      color: #e6edf3;
      font: inherit;
      font-size: 13px;
      padding: 0 10px;
      outline: none;
    }
    #quickSelect:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 2px rgba(56,139,253,.2);
    }
    #quickAskBtn {
      border: 1px solid #388bfd;
      color: #58a6ff;
      border-radius: 8px;
      height: 34px;
    }
    #quickAskBtn:hover { background: #1f3a5f; }

    @media (max-width: 640px) {
      .quick-builder { grid-template-columns: 1fr; }
    }

    /* ── Message list ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .msg-row.user  { flex-direction: row-reverse; }
    .msg-row.assistant { flex-direction: row; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-row.user .avatar     { background: #1f6feb; }
    .msg-row.assistant .avatar { background: #21262d; border: 1px solid #30363d; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: #1f6feb;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: #161b22;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
      color: #e6edf3;
    }

    /* SOP 欄位高亮 */
    .bubble .tag-clause  { color: #f78166; font-weight: 600; }
    .bubble .tag-basis   { color: #ffa657; }
    .bubble .tag-action  { color: #3fb950; }
    .bubble .tag-cascade { color: #58a6ff; }

    /* 分析中 indicator */
    .thinking {
      display: flex; align-items: center; gap: 8px;
      color: #8b949e; font-size: 13px; padding: 4px 0;
    }
    .thinking .dots span {
      display: inline-block;
      width: 5px; height: 5px; border-radius: 50%;
      background: #8b949e; margin: 0 1px;
      animation: bounce .9s infinite;
    }
    .thinking .dots span:nth-child(2) { animation-delay: .15s; }
    .thinking .dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-5px); }
    }

    /* 錯誤訊息 */
    .bubble.error { background: #2d1a1a; border-color: #f85149; color: #f85149; }

    /* ── Input area ── */
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 0 16px;
      flex-shrink: 0;
      border-top: 1px solid #21262d;
    }
    #questionInput {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      height: 52px;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color .15s;
      font-family: inherit;
    }
    #questionInput:focus { border-color: #388bfd; }
    #questionInput::placeholder { color: #484f58; }
    #sendBtn,
    #resetBtn {
      background: #238636;
      border: none; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 600;
      padding: 0 18px; cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    #sendBtn:hover:not(:disabled) { background: #2ea043; }
    #sendBtn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
    #resetBtn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    #resetBtn:hover:not(:disabled) { background: #30363d; }
    #resetBtn:disabled { color: #484f58; cursor: not-allowed; }

    /* ── Welcome placeholder ── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #484f58;
      gap: 8px;
      text-align: center;
    }
    #welcome .icon { font-size: 40px; }
    #welcome p { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>🚦 交通指揮策略諮詢顧問 Squirrel</h1>
  <div class="mode-badge">LLM 模式：<span id="modeLabel">讀取中…</span></div>
</header>

<main>
  <!-- SOP 分類快捷提問 -->
  <div class="quick-panel" aria-label="SOP 分類快捷提問">
    <div class="quick-label">固定範圍，一鍵提問</div>
    <div class="quick-direct" role="group" aria-label="固定情境快捷提問">
      <button type="button" onclick="quickAsk('假設忠孝東路四段已達 A 級壅塞，依 SOP 要啟動哪些交通應變？')">忠孝東路四段 A 級</button>
      <button type="button" onclick="quickAsk('假設光復南路已達 B 級壅塞，依 SOP 要啟動哪些交通應變？')">光復南路 B 級</button>
      <button type="button" onclick="quickAsk('假設捷運國父紀念館站人潮增至 40,000 人，依 SOP 要啟動哪些捷運與接駁措施？')">國父紀念館站分流</button>
      <button type="button" onclick="quickAsk('假設大巨蛋人潮曾達 40,000 人且開始散場，依 SOP 要啟動哪些措施並連動什麼檢查？')">大巨蛋散場啟動</button>
    </div>
    <div class="quick-label">需要指定地點</div>
    <div class="quick-categories" role="group" aria-label="SOP 類別">
      <button type="button" data-quick-set="incident">車禍與路障應變</button>
      <button type="button" data-quick-set="signal">號誌故障應變</button>
      <button type="button" data-quick-set="notification">數位通報</button>
    </div>
    <div class="quick-builder">
      <select id="quickSelect" aria-label="選擇地點"></select>
      <button type="button" id="quickAskBtn">套用情境</button>
    </div>
  </div>

  <!-- 訊息區 -->
  <div id="messages" role="log" aria-live="polite" aria-label="對話記錄">
    <div id="welcome">
      <div class="icon">🛡️</div>
      <p>輸入假設性問題或點選上方快捷按鈕<br>AI 將依 SOP 全文給出應變建議</p>
    </div>
  </div>

  <!-- 輸入區 -->
  <div class="input-area">
    <textarea
      id="questionInput"
      placeholder="直接輸入假設性問題，例如：如果光復南路發生事故，應該怎麼處理？"
      rows="1"
      aria-label="輸入問題"
    ></textarea>
    <button id="resetBtn" aria-label="清除對話">清除</button>
    <button id="sendBtn" aria-label="送出問題">送出</button>
  </div>
</main>

<script>
  // ── 狀態 ──
  const history = [];   // [{ role, content }]
  let isLoading = false;

  // ── DOM refs ──
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('questionInput');
  const sendBtn      = document.getElementById('sendBtn');
  const resetBtn     = document.getElementById('resetBtn');
  const welcomeEl    = document.getElementById('welcome');
  const modeLabelEl  = document.getElementById('modeLabel');
  const quickSelectEl = document.getElementById('quickSelect');
  const quickAskBtn   = document.getElementById('quickAskBtn');
  let activeQuickSet = 'incident';

  // ── 初始化：讀取 LLM 模式 ──
  fetch('/health')
    .then(r => r.json())
    .then(d => { modeLabelEl.textContent = d.mode ?? '未知'; })
    .catch(() => { modeLabelEl.textContent = '離線'; });

  // ── SOP 分類快捷提問 ──
  const roadNames = [
    '忠孝東路四段',
    '光復南路',
    '基隆路一段',
    '市民大道四段',
    '仁愛路四段',
    '敦化南路一段',
    '松高路',
    '延吉街',
    '基隆路地下道',
    '市府路',
    '松壽路',
    '敦化南路二段',
    '信義路五段',
    '松智路',
    '復興南路一段',
  ];

  const stationNames = [
    '大巨蛋場館內',
    '捷運國父紀念館站',
    '松山文創園區',
    '捷運忠孝敦化站',
    '信義威秀商圈',
    '台北101廣場',
    '市府轉運站',
    'ATT4FUN周邊',
    '捷運市政府站',
  ];

  const quickSets = {
    incident: roadNames.map(name => ({
      label: name,
      text: `如果${name}發生嚴重車禍並造成路段封鎖，依 SOP 應該怎麼改道、通報，預計多久恢復？`,
    })),
    signal: roadNames.map(name => ({
      label: name,
      text: `如果${name}號誌故障，依 SOP 要怎麼派遣現場人力、發布 CMS，預計多久恢復？`,
    })),
    notification: stationNames.map(name => ({
      label: name,
      text: `假設${name}外籍旅客比例達 35%，依 SOP 是否需要啟動多語數位通報，並產出通報建議？`,
    })),
  };

  function showQuickSet(key) {
    const options = quickSets[key] || [];
    activeQuickSet = key;
    quickSelectEl.innerHTML = '';
    options.forEach(item => {
      const option = document.createElement('option');
      option.value = item.text;
      option.textContent = item.label;
      quickSelectEl.appendChild(option);
    });

    document.querySelectorAll('[data-quick-set]').forEach(button => {
      button.classList.toggle('active', button.dataset.quickSet === key);
    });
  }

  document.querySelectorAll('[data-quick-set]').forEach(button => {
    button.addEventListener('click', () => showQuickSet(button.dataset.quickSet));
  });
  quickAskBtn.addEventListener('click', () => {
    if (!quickSelectEl.value) return;
    quickAsk(quickSelectEl.value);
  });
  showQuickSet('incident');

  function quickAsk(text) {
    if (isLoading) return;
    inputEl.value = text;
    sendMessage();
  }

  // ── 送出訊息 ──
  async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question || isLoading) return;

    // 隱藏 welcome
    if (welcomeEl) welcomeEl.style.display = 'none';

    // 顯示使用者訊息
    appendBubble('user', question);
    history.push({ role: 'user', content: question });
    inputEl.value = '';
    adjustTextareaHeight();

    // 顯示「分析中」
    const thinkingId = appendThinking();
    setLoading(true);

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: history.slice(0, -1) }),
      });

      const data = await res.json();
      removeThinking(thinkingId);

      if (data.ok) {
        appendBubble('assistant', data.answer);
        history.push({ role: 'assistant', content: data.answer });
        // 更新 mode label
        if (data.mode) modeLabelEl.textContent = data.mode;
      } else {
        appendBubble('assistant', data.error || 'AI 服務發生錯誤', true);
        history.pop(); // 移除失敗的 user 訊息
      }
    } catch (err) {
      removeThinking(thinkingId);
      appendBubble('assistant', `無法連線到後端伺服器：${err.message}`, true);
      history.pop();
    } finally {
      setLoading(false);
    }
  }

  // ── 新增氣泡 ──
  function appendBubble(role, text, isError = false) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';
    avatar.setAttribute('aria-hidden', 'true');

    const bubble = document.createElement('div');
    bubble.className = `bubble${isError ? ' error' : ''}`;
    bubble.innerHTML = role === 'assistant' ? formatAnswer(text) : escapeHtml(text);

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  // ── 格式化 AI 回答：高亮四個欄位 ──
  function formatAnswer(text) {
    return escapeHtml(text)
      .replace(/(■ 判定：[^\n]+)/g,      '<span class="tag-clause">$1</span>')
      .replace(/(■ 依據：[^\n]+)/g,      '<span class="tag-basis">$1</span>')
      .replace(/(■ 建議處置：[^\n]+)/g,  '<span class="tag-action">$1</span>')
      .replace(/(■ 後續確認：[^\n]+)/g,  '<span class="tag-cascade">$1</span>')
      .replace(/(■ 觸發條款：[^\n]+)/g,  '<span class="tag-clause">$1</span>')
      .replace(/(■ 判定依據：[^\n]+)/g,  '<span class="tag-basis">$1</span>')
      .replace(/(■ 預期動作：[^\n]+)/g,  '<span class="tag-action">$1</span>')
      .replace(/(■ 連鎖檢查：[^\n]+)/g,  '<span class="tag-cascade">$1</span>')
      .replace(/(■ 備註：[^\n]+)/g,       '<span style="color:#8b949e">$1</span>');
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── 分析中動畫 ──
  function appendThinking() {
    const id = `thinking-${Date.now()}`;
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.id = id;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';
    avatar.setAttribute('aria-hidden', 'true');

    const thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = `
      <span>分析中，載入 SOP…</span>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>`;

    row.appendChild(avatar);
    row.appendChild(thinking);
    messagesEl.appendChild(row);
    scrollToBottom();
    return id;
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── 工具函式 ──
  function setLoading(val) {
    isLoading = val;
    sendBtn.disabled = val;
    resetBtn.disabled = val;
    inputEl.disabled = val;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function adjustTextareaHeight() {
    inputEl.style.height = '52px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  // ── 鍵盤：Enter 送出，Shift+Enter 換行 ──
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', adjustTextareaHeight);

  sendBtn.addEventListener('click', sendMessage);
  resetBtn.addEventListener('click', () => {
    if (isLoading) return;
    history.length = 0;
    messagesEl.querySelectorAll('.msg-row').forEach(row => row.remove());
    if (welcomeEl) welcomeEl.style.display = 'flex';
    inputEl.value = '';
    adjustTextareaHeight();
  });
</script>
</body>
</html>
